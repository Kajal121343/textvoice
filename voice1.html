<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Speech-to-Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0a0a10;
            background-image: radial-gradient(circle at 50% 0%, #2a0a1a 0%, #0a0a10 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .app-container {
            background: rgba(25, 15, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 65, 108, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 0 40px rgba(255, 65, 108, 0.1);
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: -20px;
            left: 20px;
            background: #2a0a1a;
            color: #ff416c;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #ff416c;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #ff416c;
            color: #fff;
            box-shadow: 0 0 15px #ff416c;
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        h3 {
            text-align: center;
            color: #a08890;
            font-weight: 400;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            color: #fff;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        textarea:focus {
            border-color: #ff416c;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.2);
        }

        textarea::placeholder {
            color: #555;
        }

        /* Pulsing Mic Button */
        .mic-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            color: #ff416c;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #ff416c;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mic-btn:hover {
            background: #ff416c;
            color: #fff;
            box-shadow: 0 0 30px #ff416c;
        }

        /* Class added by JS when listening */
        .mic-btn.listening {
            background: #ff416c;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 65, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <a href="index.html" class="back-btn">← Dashboard</a>
        
        <h2>Speech to Text</h2>
        <h3>Click the button and start speaking</h3>
        
        <textarea id="myText" placeholder="Your transcribed text will appear here..."></textarea> 
        <button id="speechBtn" class="mic-btn">Start Listening</button> 
    </div>

    <script>
        const textInput = document.querySelector("#myText");
        const speechBtn = document.querySelector("#speechBtn");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            let recognition = new SpeechRecognition(); 
            recognition.continuous = true; // Keeps listening until stopped
            recognition.interimResults = true; // Shows words as you speak

            recognition.onstart = function() {
                speechBtn.innerText = "🎙️ Listening... (Click to Stop)";
                speechBtn.classList.add("listening");
            };

            recognition.onresult = function(event) { 
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if(finalTranscript) {
                     textInput.value += finalTranscript + " ";
                }
            }

            recognition.onerror = function(event) {
                console.error(event.error);
                speechBtn.innerText = "Microphone Error";
                speechBtn.classList.remove("listening");
            }

            recognition.onend = function() {
                speechBtn.innerText = "Start Listening";
                speechBtn.classList.remove("listening");
            };

            // Toggle start/stop
            speechBtn.onclick = function() {
                if (speechBtn.classList.contains("listening")) {
                    recognition.stop();
                } else {
                    textInput.value = ""; // Clear old text if starting fresh
                    recognition.start(); 
                }
            }
        } else {
            speechBtn.innerText = "Browser Not Supported";
            speechBtn.style.borderColor = "gray";
            speechBtn.style.color = "gray";
            alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
        }
    </script>
</body>
</html>
